services:

  api:
    build:
      context: ./api
    container_name: django-docker
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - ./api/.env.prod

  nginx:
    # build:
    #   context: ./api
    image: nginx:latest
    container_name: frontend-proxy
    ports:
      - "8001:80"
    volumes:
      - ./api/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static:ro
    depends_on:
      - api

  server:
    image: catjitsu-server
    environment:
      PORT: "8080"
    build:
      context: ./server
    container_name: catjitsu-server
    ports:
      - "9000:8080"
    # depends_on:
    #   - nginx

  client:
    image: catjitsu-client
    build:
      context: ./client
    container_name: catjitsu-client
    ports:
      - "8443:443"
    depends_on:
      - server

volumes:
  static_volume: