services:

  api:
    build: .
    container_name: django-docker
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - .env.prod

  nginx:
    image: nginx:latest
    container-name: frontend-proxy
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static:ro
    depends_on:
      - api

volumes:
  static_volume: