{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catjitsu: Authentication Complete</title>
  <link rel="icon" href="{% static 'images/icon.svg' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Pink gradient background only — no other content changed */
    :root { --cj-pink: #d63384; }
    body {
      background-image: linear-gradient(135deg, #fff0f6 0%, #ffd6e8 40%, #ffb3d9 100%);
      background-attachment: fixed;
      background-repeat: no-repeat;
      min-height: 100vh;
      color: #3b2a33;
    }
    /* keep component styles local and unchanged */
    .card-pink { border-left: .5rem solid var(--cj-pink); }
    .text-pink { color: var(--cj-pink) !important; }
    .btn-pink {
      background-color: var(--cj-pink);
      border-color: var(--cj-pink);
      color: #fff;
    }
    .btn-pink:hover { background-color: #b02a6b; border-color: #b02a6b; }
  </style>
</head>
<body class="">
  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card card-pink shadow-sm" style="max-width:520px; width:100%;">
      <div class="card-body text-center py-5">
        <div class="mb-3">
          <i class="bi bi-check-circle-fill text-pink" style="font-size:3.2rem"></i>
        </div>
        <h1 class="h4 fw-bold">Authentication complete</h1>
        <p class="text-muted mb-4">The authentication process finished successfully. You may safely close this window.</p>
      </div>
    </div>
  </div>
  <!-- Bootstrap JS (optional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
